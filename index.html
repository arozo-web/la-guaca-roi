<title>Repuestos La Guaca · Caso de negocio Salesforce</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
#login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#032D60,#0B5CAB 55%,#0176D3)}
.box{width:100%;max-width:400px;background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.35)}
.top{background:#032D60;padding:26px 24px 20px;text-align:center;border-bottom:5px solid #E8730C}
.top img{height:62px;max-width:240px;object-fit:contain}
.top h1{color:#fff;font-size:18px;margin:12px 0 2px}
.top p{color:#BFD6F2;font-size:13px;margin:0}
form{padding:24px}
label{display:block;font-weight:700;color:#032D60;font-size:13.5px;margin-bottom:6px}
input{width:100%;padding:12px 14px;font-size:16px;border:1.5px solid #D8E3F0;border-radius:10px;background:#F3F7FC}
input:focus{outline:2px solid #57A3FD;background:#fff}
button{width:100%;margin-top:14px;padding:12px;font-size:15px;font-weight:800;border:0;border-radius:10px;background:#0176D3;color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{color:#BA0517;font-size:13px;font-weight:600;min-height:18px;margin-top:10px}
.foot{font-size:11.5px;color:#5C6B7E;text-align:center;padding:0 24px 20px}
#app{display:none;position:fixed;inset:0;width:100%;height:100%;border:0}
#logout{display:none;position:fixed;right:10px;bottom:10px;z-index:5;width:auto;margin:0;padding:6px 12px;font-size:12px;background:#032D60;opacity:.8}
</style>
<script src="config.js"></script>
</head>

<div id="login">
  <div class="box">
    <div class="top">
      <img src="https://laguacaenlinea.cr/skins/la_guacamaya/customer/images/footer-logo.png" alt="La Guaca" onerror="this.style.display='none'">
      <h1>Caso de negocio Salesforce</h1>
      <p>Repuestos La Guaca · Costa Rica · Fast Cloud Consulting</p>
    </div>
    <form id="f" autocomplete="off">
      <label for="pw">Contraseña de acceso</label>
      <input id="pw" type="password" autofocus placeholder="••••••••">
      <button id="go" type="submit">Ingresar</button>
      <div class="err" id="err"></div>
    </form>
    <div class="foot">Documento confidencial preparado para Repuestos La Guaca.</div>
  </div>
</div>

const CFG=window.GUACA_CONFIG||{};
const te=new TextEncoder(), td=new TextDecoder();
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64=u=>{let s='';const a=new Uint8Array(u);for(let i=0;i<a.length;i+=0x8000)s+=String.fromCharCode.apply(null,a.subarray(i,i+0x8000));return btoa(s)};
const norm=p=>String(p||'').trim().toLowerCase();
async function deriveKey(pw){
  const base=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:unb64(SALT),iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function sha256hex(s){const h=await crypto.subtle.digest('SHA-256',te.encode(s));return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('')}

function makeBackend(key,accessKey){
  const url=(CFG.workerUrl||'').replace(/\/+$/,'');
  const enc=async str=>{const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,te.encode(str));return {iv:b64(iv),ct:b64(ct)}};
  const dec=async o=>td.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.iv)},key,unb64(o.ct)));
  if(!url) return {readonly:true,get:async()=>({json:null,updatedAt:0}),save:async()=>{throw {readonly:true}},stamp:async()=>0};
  const H={'X-Access-Key':accessKey};
  return {
    get:async()=>{const r=await fetch(url+'/state',{headers:H,cache:'no-store'});if(!r.ok)throw new Error('GET '+r.status);
      const d=await r.json();if(!d.data)return {json:null,updatedAt:0};return {json:await dec(d.data),updatedAt:d.updatedAt||0}},
    save:async(json,base)=>{const r=await fetch(url+'/state',{method:'PUT',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify({data:await enc(json),base:base||0})});
      if(!r.ok)throw new Error('PUT '+r.status+' '+await r.text());return r.json()},
    stamp:async()=>{const r=await fetch(url+'/stamp',{headers:H,cache:'no-store'});if(!r.ok)return 0;return (await r.json()).updatedAt||0}
  };
}
async function unlock(pw){
  const key=await deriveKey(pw);
  const html=td.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(IV)},key,unb64(CT)));
  window.GUACA_BACKEND=makeBackend(key,await sha256hex('laguaca-acceso:'+pw));
  const fr=document.getElementById('app');fr.srcdoc=html;fr.style.display='block';
  document.getElementById('login').style.display='none';document.getElementById('logout').style.display='block';
  try{sessionStorage.setItem('guaca_pw',pw)}catch(e){}
}
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();const b=document.getElementById('go'),er=document.getElementById('err');
  b.disabled=true;b.textContent='Verificando…';er.textContent='';
  try{await unlock(norm(document.getElementById('pw').value))}
  catch(x){er.textContent='Contraseña incorrecta.';b.disabled=false;b.textContent='Ingresar'}
});
document.getElementById('logout').onclick=()=>{try{sessionStorage.removeItem('guaca_pw')}catch(e){}location.reload()};
(async()=>{let p=null;try{p=sessionStorage.getItem('guaca_pw')}catch(e){}if(p){try{await unlock(p)}catch(e){}}})();
</script>
